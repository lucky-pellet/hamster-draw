    <meta name="theme-color" content="#257a52" />
    <script>
      // Stream view (?embed=1, optionally &bg=transparent): mark the page before its first paint, so an OBS
      // source never flashes the cream page. The app reads the same class to render the stream view.
      (function () {
        var q = new URLSearchParams(window.location.search);
        if (!q.has("embed") || q.get("embed") === "0") return;
        document.documentElement.classList.add("is-embed");
        if (/^(transparent|none)$/i.test(q.get("bg") || "")) document.documentElement.classList.add("is-clear");
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
